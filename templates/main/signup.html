<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign up | MediCue</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:#F4F6F5; --surface:#FFFFFF; --ink:#1F2A28; --ink-muted:#5C6B67; --line:#DCE3E0;
            --primary:#3A6B63; --primary-dark:#274A44; --primary-soft:#E4ECE9;
        }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { margin: 0; }
        .auth-wrap {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(160deg, var(--primary-dark), var(--primary));
        }
        .auth-card { background: var(--surface); width: 380px; padding: 40px 32px; border-radius: 18px; box-shadow: 0 20px 50px rgba(0,0,0,0.25); }
        .brand-row { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 18px; }
        .brand-row span { font-family: 'Fraunces', serif; font-weight: 600; font-size: 20px; color: var(--ink); }
        h2 { text-align: center; margin: 0 0 24px; font-size: 20px; color: var(--ink); font-weight: 500; }
        label { font-size: 13px; font-weight: 500; color: var(--ink-muted); display: block; margin-bottom: 6px; }
        .field { margin-bottom: 18px; }
        input, select {
            width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
            font-size: 14px; outline: none; background: #fff; font-family: 'Inter', sans-serif;
        }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
        button {
            width: 100%; padding: 12px; border: none; border-radius: 10px; background: var(--primary);
            color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
        }
        button:hover { background: var(--primary-dark); }
        .foot { text-align: center; margin-top: 18px; font-size: 13px; color: var(--ink-muted); }
        .foot a { color: var(--primary); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <div class="brand-row">
            <svg width="24" height="24" viewBox="0 0 26 26" fill="none">
                <rect x="2" y="9" width="22" height="8" rx="4" stroke="#3A6B63" stroke-width="2"/>
                <path d="M13 9V17" stroke="#3A6B63" stroke-width="2"/>
                <rect x="2" y="9" width="11" height="8" rx="4" fill="#3A6B63"/>
            </svg>
            <span>MediCue</span>
        </div>
        <h2>Create your account</h2>

        {% if error %}
            <div style="background:#F5E5E1;color:#B5533F;font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:16px;">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="field">
                <label>Username</label>
                <input type="text" name="username" placeholder="Choose a username" required>
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" name="password" placeholder="Choose a password" required>
            </div>
            <div class="field">
                <label>Role</label>
                <select name="role" required>
                    <option value="">Select role</option>
                    <option value="doctor">Doctor</option>
                    <option value="patient">Patient</option>
                    <option value="caregiver">Caregiver</option>
                </select>
            </div>
            <button type="submit">Sign up</button>
        </form>

        <div class="foot">Already have an account? <a href="/login/">Log in</a></div>
    </div>
</div>
</body>
</html>
